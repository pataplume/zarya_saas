name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  # Suite d'intégration lourde rejouée chaque nuit (filet de sécurité hors PR).
  schedule:
    - cron: "0 3 * * *"
  # Permet de lancer la suite d'intégration à la demande (bouton Actions).
  workflow_dispatch:

# Annuler les runs en cours si un nouveau commit arrive sur la même PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version lue depuis packageManager dans package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome check
        run: pnpm biome check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm typecheck

  # Tests unitaires (packages/ + tests/unit) — purs/mockés, AUCUNE base, ~quelques secondes.
  # Bloquants sur CHAQUE PR : c'est le filet rapide. Aucun secret DB nécessaire : le garde-fou
  # P0-2 de tests/setup.ts écarte DATABASE_URL et substitue une URL factice inconnectable pour
  # que le chargement du module @zarya/db (new URL() au import) ne casse pas.
  test-unit:
    name: Tests unitaires (rapides)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test:unit

  # Suite d'intégration (tests/integration) — base Supabase PARTAGÉE, ~30-40 min, SÉRIALISÉE
  # (un seul run à la fois sur toutes les branches). Ne tourne PAS sur chaque PR (trop lent) :
  #  - sur push develop/main (garde main vert) ;
  #  - chaque nuit (cron) ;
  #  - à la demande (workflow_dispatch) ;
  #  - sur une PR portant le label `run-integration` (validation ciblée avant merge sensible).
  # Pas de check requis en protection de branche → un skip ne bloque pas le merge.
  test-integration:
    name: Tests (isolation multi-tenant)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-integration'))
    # Sérialise CE job entre TOUTES les exécutions : un seul run accède à la fois à la base
    # Supabase de test PARTAGÉE (collisions seed/cleanup sinon). Groupe constant + pas
    # d'annulation = file d'attente. Cf. addendum ADR 0005 (DB partagée).
    concurrency:
      group: integration-tests-shared-db
      cancel-in-progress: false
    env:
      # ⚠️ Garde-fou P0-2 (AUDIT-MVP.md § 8) : les tests ne lisent QUE TEST_DATABASE_URL —
      # jamais DATABASE_URL — et refusent toute URL contenant la ref du projet de PROD.
      # Ces trois secrets doivent pointer le projet Supabase DE TEST (jamais la prod) :
      # les tests créent aussi de vrais users via l'API admin GoTrue du projet pointé.
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      # Base Supabase PARTAGÉE plafonnée à max_connections=60 (~57 utilisables), en concurrence
      # avec PostgREST/GoTrue/pg_cron + les déploiements Vercel. On borne le footprint du singleton
      # `db` (sinon 10 connexions par défaut) pour éviter la saturation `53300`. Tests sérialisés
      # (singleFork) → 3 suffisent ; idle_timeout libère vite les slots entre fichiers.
      DB_POOL_MAX: "3"
      DB_IDLE_TIMEOUT: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Next.js build
        run: pnpm build
